<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000"><title>NEXUS</title>
<style>
:root{--ink:#ececf1;--dim:#85858f;--ln:#ffffff17;--sf:#ffffff0a;--ac:#9fb2ff;--ok:#7ee0a6;--er:#ff7b8a;--ui:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Inter,sans-serif;--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;color-scheme:dark}
*{box-sizing:border-box}html,body{height:100%;margin:0;background:#000;color:var(--ink)}
body{font:15px/1.55 var(--ui);display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);overflow:hidden;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(60% 38% at 50% -12%,#7c8cff22,transparent 70%);pointer-events:none}
button,select,textarea,input{font:inherit;color:inherit}
button,select{border:1px solid var(--ln);background:var(--sf);border-radius:10px;min-height:38px;padding:0 12px;cursor:pointer}
button:hover{background:#ffffff14}:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.dim{color:var(--dim)}.pri{background:var(--ink);color:#000;border:0;font-weight:600}.pri:hover{background:#fff}
header{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--ln);position:relative;z-index:2}
.brand{font-weight:700;letter-spacing:.24em;margin:0 4px}
#ss{flex:1;min-width:0;max-width:300px;text-overflow:ellipsis;background:transparent;border-color:transparent}
.chip{margin-left:auto;font-size:12px;color:var(--dim);max-width:46vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#meter{height:2px;background:var(--ln)}#meter i{display:block;height:100%;width:0;background:var(--ac);transition:width .4s}#meter.hot i{background:var(--er)}
#log{flex:1;overflow:auto;padding:18px 14px 8px;position:relative;z-index:1}
#col{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.m{padding:2px 0;overflow-wrap:anywhere}.m.user{align-self:flex-end;max-width:88%;background:#ffffff12;border:1px solid var(--ln);border-radius:16px;padding:8px 14px;white-space:pre-wrap}
.m.err{border:1px solid #ff7b8a55;color:var(--er);border-radius:12px;padding:8px 12px}.m.sys{color:var(--dim);font-size:13px}
.m pre,.bd pre{margin:0;padding:8px 12px;font:12px/1.5 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere;max-height:280px;overflow:auto}
.m pre{background:#ffffff0a;border:1px solid var(--ln);border-radius:10px;margin:6px 0}.m code{font:13px var(--mono);background:#ffffff12;border-radius:5px;padding:1px 5px}
.think{color:var(--dim);font-size:13px;border-left:2px solid var(--ln);padding-left:12px}.think summary{cursor:pointer;list-style:none}.think summary::-webkit-details-marker{display:none}
.think>div{white-space:pre-wrap;overflow-wrap:anywhere;max-height:220px;overflow:auto;margin-top:6px}
.think.live summary{background:linear-gradient(90deg,var(--dim),#fff,var(--dim)) 0 0/220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 1.8s linear infinite}
.tool{border:1px solid var(--ln);border-radius:12px;background:var(--sf);overflow:hidden;position:relative}
.tool summary{display:flex;gap:10px;align-items:center;padding:9px 12px;cursor:pointer;list-style:none;font-size:13px}.tool summary::-webkit-details-marker{display:none}
.tool b{font-weight:600}.tool span{flex:1;min-width:0;color:var(--dim);font:12px var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tool em{font:11px var(--mono);font-style:normal;color:var(--dim)}
.st{width:8px;height:8px;border-radius:50%;background:var(--dim);flex:none}.run .st{background:var(--ac);animation:pl 1s infinite}.ok .st{background:var(--ok)}.bad .st{background:var(--er)}
.tool.run::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;background:linear-gradient(110deg,transparent 30%,var(--ac) 50%,transparent 70%) 0 0/250% 100%;-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:sw 1.6s linear infinite}
.bd{border-top:1px solid var(--ln)}.bd:empty{display:none}.df b{display:block;font:12px var(--mono);color:var(--dim);padding:8px 12px 0}
.add{background:#7ee0a614;color:#bdf2d3}.del{background:#ff7b8a14;color:#ffc4cb}.out{color:#cfcfd6}.out.er{color:var(--er)}.note{padding:6px 12px;font-size:12px;color:var(--dim)}
#st{max-width:760px;width:100%;margin:0 auto;padding:0 18px;font-size:12px;color:var(--dim);min-height:18px;position:relative;z-index:1}
#todo{max-width:760px;width:calc(100% - 24px);margin:0 auto 8px;border:1px solid var(--ln);border-radius:12px;padding:8px 12px;font-size:13px;position:relative;z-index:1;background:#000c}
.td{display:flex;gap:8px;color:var(--dim)}.td i{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--dim);margin-top:7px;flex:none}.td.in_progress{color:var(--ink)}.td.in_progress i{border-color:var(--ac);background:var(--ac)}.td.done{text-decoration:line-through}.td.done i{background:var(--ok);border-color:var(--ok)}
#cmp{max-width:760px;width:calc(100% - 20px);margin:0 auto 10px;padding:6px 6px 6px 14px;display:flex;gap:8px;align-items:flex-end;border:1px solid var(--ln);border-radius:24px;background:#ffffff08;position:relative;z-index:1}
#cmp:focus-within{border-color:#9fb2ff66}#in{flex:1;border:0;background:none;resize:none;outline:0;padding:8px 0;max-height:140px}
#go{width:40px;height:40px;min-height:0;padding:0;border-radius:50%;background:var(--ink);color:#000;border:0;font-size:18px;font-weight:700}
#cmp.busy::before{content:"";position:absolute;inset:-1px;border-radius:inherit;padding:1px;pointer-events:none;background:conic-gradient(from var(--a,0deg),transparent 55%,var(--ac),#c59bff,transparent 95%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:orb 2.4s linear infinite}
@property --a{syntax:"<angle>";initial-value:0deg;inherits:false}@keyframes orb{to{--a:360deg}}
@keyframes sw{to{background-position:-150% 0}}@keyframes sh{to{background-position:-220% 0}}@keyframes pl{50%{opacity:.3}}
#files{position:fixed;z-index:20;top:0;bottom:0;left:0;width:min(88vw,340px);background:#000;border-right:1px solid var(--ln);transform:translateX(-102%);transition:transform .2s;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}#files.on{transform:none}
.fh{display:flex;align-items:center;gap:8px;padding:12px}.fh b{flex:1;overflow:hidden;text-overflow:ellipsis}#fl{overflow:auto;padding:0 8px 12px;display:grid;gap:2px;align-content:start}
#fl button{border:0;background:none;text-align:left;font:12.5px var(--mono);min-height:34px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#fl p{padding:8px}
dialog{background:#000;color:var(--ink);border:1px solid var(--ln);border-radius:18px;padding:16px;width:min(94vw,560px);max-height:88vh}dialog::backdrop{background:#000c}
#vb{margin:0;font:12px/1.5 var(--mono);white-space:pre;overflow:auto;max-height:68vh;padding:8px;background:#ffffff08;border-radius:10px}
#sf{display:grid;gap:12px}#sf h3{margin:0}#sf label{display:grid;gap:4px;color:var(--dim);font-size:12px}#sf input{background:#ffffff0a;border:1px solid var(--ln);border-radius:10px;min-height:40px;padding:0 10px;color:var(--ink)}.bt{display:flex;gap:8px;justify-content:flex-end}
#toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#161618;border:1px solid var(--ln);padding:8px 14px;border-radius:20px;font-size:13px;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw}#toast.on{opacity:1}
@media(prefers-reduced-motion:reduce){*,*::before{animation:none!important;transition:none!important}}
</style></head><body>
<header><button id="bf" aria-label="Open workspace files">Files</button><span class="brand">NEXUS</span><select id="ss" aria-label="Chat"></select><button id="chip" class="chip" aria-label="Connection settings"></button></header>
<div id="meter"><i></i></div>
<main id="log"><div id="col"></div></main>
<div id="st" aria-live="polite"></div><div id="todo" hidden></div>
<form id="cmp"><textarea id="in" rows="1" placeholder="Describe what to build, fix or run" aria-label="Message"></textarea><button id="go" type="submit" aria-label="Send">↑</button></form>
<aside id="files"><div class="fh"><b>Workspace</b><button id="fr">Refresh</button><button id="fx">Close</button></div><div id="fl"></div></aside>
<dialog id="view"><div class="fh"><b id="vt"></b><button id="vc">Close</button></div><pre id="vb"></pre></dialog>
<dialog id="set"><form id="sf" method="dialog"><h3>Connection</h3>
<label>Access token<input id="t1" type="password" autocomplete="off" placeholder="The ACCESS_TOKEN set on Render"></label>
<label>Your Anthropic API key<input id="t2" type="password" autocomplete="off" placeholder="Optional. Tried before the Render key"></label>
<label>Model<input id="t3" autocomplete="off" placeholder="Server default"></label>
<p class="dim" style="margin:0;font-size:13px">Keys are tried in this order: yours, Render’s, Render’s backup. Your key stays in this browser and goes only to your own server.</p>
<div class="bt"><button type="button" id="sc">Cancel</button><button class="pri" id="sv">Save</button></div></form></dialog>
<div id="toast"></div>
<script>
const $=s=>document.querySelector(s),LS=localStorage,esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rid=()=>Math.random().toString(36).slice(2,10).padEnd(8,'x');
let sid=LS.nx_s||(LS.nx_s=rid()),ac=null,cur={tools:{}},cfg={};
const H=()=>({'content-type':'application/json',authorization:'Bearer '+(LS.nx_t||''),...(LS.nx_k?{'x-user-key':LS.nx_k}:{})});
const api=async u=>{const r=await fetch(u,{headers:H()}),j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'HTTP '+r.status);return j};
const log=$('#log'),col=$('#col'),el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};
const down=()=>{if(log.scrollHeight-log.scrollTop-log.clientHeight<220)log.scrollTop=log.scrollHeight};
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),3600)};
const status=t=>$('#st').textContent=t;
const md=t=>String(t).split('```').map((s,i)=>i%2?`<pre>${esc(s.replace(/^[\w-]*\n/,''))}</pre>`:esc(s).replace(/`([^`\n]+)`/g,'<code>$1</code>').replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>').replace(/\n/g,'<br>')).join('');
const bubble=(c,t,raw)=>{const e=el('div','m '+c);raw?e.textContent=t:e.innerHTML=md(t);col.append(e);down();return e};
const meter=(u,c)=>{const p=Math.min(100,u/c*100);$('#meter i').style.width=p+'%';$('#meter').className=p>70?'hot':'';$('#meter').title='Context: '+u.toLocaleString()+' of '+c.toLocaleString()+' tokens'};
const chip=s=>$('#chip').textContent=(cfg.model||'')+' · '+({local:'your key',render:'Render key','render-2':'Render backup key'}[s]||'no key');
/* thinking: streamed live, kept in the transcript */
const think=d=>{if(!cur.k){cur.k0=Date.now();cur.kx='';cur.k=el('details','think live','<summary>Thinking</summary><div></div>');cur.k.open=true;col.append(cur.k)}cur.kx+=d;cur.k.lastChild.textContent=cur.kx;cur.k.lastChild.scrollTop=1e9;down()};
const endThink=()=>{const e=cur.k;if(!e)return;cur.k=null;e.classList.remove('live');e.open=false;e.firstChild.textContent='Thought for '+Math.max(1,Math.round((Date.now()-cur.k0)/1000))+'s'};
const thinkS=t=>{const e=el('details','think','<summary>Thought</summary><div></div>');e.lastChild.textContent=t;col.append(e)};
const text=d=>{endThink();if(!cur.t){cur.t=el('div','m ai');cur.tx='';col.append(cur.t)}cur.tx+=d;cur.t.innerHTML=md(cur.tx);down()};
/* tool cards exist only between a real tool_start and tool_result */
const clip=s=>{s=String(s);const L=s.split('\n');return L.length>14?L.slice(0,14).join('\n')+'\n… +'+(L.length-14)+' lines':s};
const lab=(n,a)=>{const E=a.edits||[],F=[...new Set(E.map(e=>e.path))],T=a.todos||[];return({read:['Read',a.path],write:['Write',a.path],multi_edit:['Edit',F.length>1?F.length+' files, '+E.length+' edits':(F[0]||'')+(E.length>1?', '+E.length+' edits':'')],glob:['List',a.pattern||'**/*'],grep:['Search',a.pattern],bash:['Run',a.command],fetch_url:['Fetch',a.url],todo:['Plan',T.filter(t=>t.status==='done').length+' of '+T.length+' done']}[n])||[n,'']};
const todos=l=>{const t=$('#todo');if(!l||!l.length){t.hidden=true;return}t.hidden=false;t.innerHTML=l.map(x=>`<div class="td ${esc(x.status)}"><i></i>${esc(x.text)}</div>`).join('')};
const startTool=(id,n,a)=>{endThink();cur.t=null;a=a||{};const[v,t]=lab(n,a),e=el('details','tool run k-'+n,`<summary><i class="st"></i><b>${esc(v)}</b><span>${esc(String(t||'').slice(0,100))}</span><em></em></summary><div class="bd"></div>`),bd=e.querySelector('.bd');
 if(n==='multi_edit')bd.innerHTML=(a.edits||[]).map(x=>`<div class="df"><b>${esc(x.path)}</b>${x.old?'<pre class="del">'+esc(clip(x.old))+'</pre>':''}<pre class="add">${esc(clip(x.new))}</pre></div>`).join('');
 else if(n==='write')bd.innerHTML=`<pre class="add">${esc(clip(a.content||''))}</pre>`;
 col.append(e);cur.tools[id]=e;if(n==='todo')todos(a.todos);down()};
const tout=(id,d)=>{const e=cur.tools[id];if(!e)return;let p=e.querySelector('.out');if(!p){p=el('pre','out');e.querySelector('.bd').append(p);e.open=true}p.textContent=(p.textContent+d).slice(-4000);p.scrollTop=1e9;down()};
const endTool=(id,ok,ms,out)=>{const e=cur.tools[id];if(!e)return;e.classList.remove('run');e.classList.add(ok?'ok':'bad');if(ms!=null)e.querySelector('em').textContent=ms<1000?ms+'ms':(ms/1000).toFixed(1)+'s';
 const bd=e.querySelector('.bd'),n=e.className.match(/k-(\w+)/)[1],o=String(out==null?'':out);
 if(ok&&(n==='multi_edit'||n==='write'))bd.append(el('div','note',esc(o.slice(0,200))));
 else if(!(ok&&n==='todo')){let p=bd.querySelector('.out');if(!p){p=el('pre','out');bd.append(p)}p.textContent=o.slice(0,6000);p.className='out'+(ok?'':' er')}
 if(!ok)e.open=true;delete cur.tools[id]};
const ev=o=>{switch(o.t){
 case'key':chip(o.src);break;case'keyfail':toast(o.m);break;
 case'think':status('Thinking…');think(o.d);break;case'text':status('Writing…');text(o.d);break;
 case'compose':status('Writing a '+o.name+' call…');break;
 case'tool_start':startTool(o.id,o.name,o.input);status('Running '+lab(o.name,o.input||{})[0].toLowerCase()+'…');break;
 case'tool_out':tout(o.id,o.d);break;case'tool_result':endTool(o.id,o.ok,o.ms,o.out);status('Waiting for the model…');break;
 case'usage':meter(o.used,o.ctx);break;
 case'pruned':bubble('sys','Context was getting full: removed thinking from '+o.thinking+' older block(s)'+(o.results?' and shortened '+o.results+' old tool output(s)':'')+'. Recent thinking is untouched.',1);break;
 case'error':endThink();bubble('err',o.m,1)}};
const busy=b=>{$('#cmp').classList.toggle('busy',!!b);$('#go').textContent=b?'■':'↑';$('#go').setAttribute('aria-label',b?'Stop':'Send')};
const send=async()=>{const i=$('#in'),t=i.value.trim();if(!t||ac)return;i.value='';fit();cur={tools:{}};bubble('user',t,1);busy(1);ac=new AbortController();status('Waiting for the model…');
 try{const r=await fetch('/api/chat',{method:'POST',headers:H(),body:JSON.stringify({session:sid,text:t,model:LS.nx_m||undefined}),signal:ac.signal});if(!r.ok)throw Error((await r.json().catch(()=>({}))).error||'HTTP '+r.status);
  const rd=r.body.getReader(),dec=new TextDecoder();let buf='';for(;;){const{done,value}=await rd.read();if(done)break;buf+=dec.decode(value,{stream:true});let k;while((k=buf.indexOf('\n'))>=0){const l=buf.slice(0,k);buf=buf.slice(k+1);if(l.trim())try{ev(JSON.parse(l))}catch{}}}}
 catch(e){if(e.name!=='AbortError')bubble('err',e.message,1)}
 endThink();document.querySelectorAll('.tool.run').forEach(x=>{x.classList.remove('run');x.classList.add('bad');x.querySelector('em').textContent='stopped'});ac=null;busy(0);status('');lsess()};
const replay=s=>{col.textContent='';cur={tools:{}};todos(null);
 for(const m of s.messages){if(m.role==='user'){if(typeof m.content==='string')bubble('user',m.content,1);else for(const b of m.content)if(b.type==='tool_result')endTool(b.tool_use_id,!b.is_error,null,typeof b.content==='string'?b.content:JSON.stringify(b.content))}
  else for(const b of m.content){if(b.type==='thinking'&&b.thinking)thinkS(b.thinking);else if(b.type==='text'){cur.t=null;text(b.text);cur.t=null}else if(b.type==='tool_use')startTool(b.id,b.name,b.input)}}
 document.querySelectorAll('.tool.run').forEach(x=>{x.classList.remove('run');x.classList.add('bad')});
 if(!s.messages.length)bubble('sys','New chat. Everything here runs on your server: real files, a real shell, and nothing simulated.',1);log.scrollTop=log.scrollHeight};
const lsess=async()=>{try{const{sessions}=await api('/api/sessions'),s=$('#ss');s.innerHTML=(sessions.some(x=>x.id===sid)?'':`<option value="${sid}">New chat</option>`)+sessions.map(x=>`<option value="${x.id}">${esc(x.title)}</option>`).join('')+'<option value="+">＋ New chat</option>';s.value=sid}catch{}};
const load=async()=>{try{replay(await api('/api/session?id='+sid))}catch(e){bubble('err',e.message,1)}lsess()};
$('#ss').onchange=e=>{if(ac){e.target.value=sid;return}const v=e.target.value;sid=LS.nx_s=v==='+'?rid():v;load()};
const fit=()=>{const i=$('#in');i.style.height='auto';i.style.height=Math.min(i.scrollHeight,140)+'px'};
$('#in').oninput=fit;$('#in').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&matchMedia('(pointer:fine)').matches){e.preventDefault();$('#cmp').requestSubmit()}};
$('#cmp').onsubmit=e=>{e.preventDefault();ac?ac.abort():send()};
/* files: read straight from the server workspace */
const loadFiles=async()=>{try{const{files}=await api('/api/files');$('#fl').innerHTML=files.length?files.map(f=>`<button data-p="${esc(f)}">${esc(f)}</button>`).join(''):'<p class="dim">The workspace is empty. Ask NEXUS to create something.</p>'}catch(e){$('#fl').textContent=e.message}};
$('#bf').onclick=()=>{$('#files').classList.add('on');loadFiles()};$('#fx').onclick=()=>$('#files').classList.remove('on');$('#fr').onclick=loadFiles;$('#vc').onclick=()=>$('#view').close();
$('#fl').onclick=async e=>{const b=e.target.closest('[data-p]');if(!b)return;try{const{text}=await api('/api/file?p='+encodeURIComponent(b.dataset.p));$('#vt').textContent=b.dataset.p;$('#vb').textContent=text;$('#view').showModal()}catch(x){toast(x.message)}};
/* connection settings: your key first, then Render's */
const openSet=()=>{$('#t1').value=LS.nx_t||'';$('#t2').value=LS.nx_k||'';$('#t3').value=LS.nx_m||'';$('#set').showModal()};
$('#chip').onclick=openSet;$('#sc').onclick=()=>$('#set').close();
$('#sf').onsubmit=()=>{LS.nx_t=$('#t1').value.trim();LS.nx_k=$('#t2').value.trim();LS.nx_m=$('#t3').value.trim();boot()};
const boot=async()=>{if(!LS.nx_t){openSet();return}try{cfg=await api('/api/config');chip(LS.nx_k?'local':cfg.render?'render':null);await load()}catch(e){bubble('err',e.message,1);openSet()}};
boot();
</script></body></html>
